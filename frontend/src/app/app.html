<div class="min-h-screen bg-background text-foreground">
  <!-- Top bar renders as a card (prototype `.card`): panel surface, full 1px
       line border, 12px radius, inset from the viewport edges — not a plain
       bottom-border strip. Stays sticky so it tracks the scroll. -->
  <header
    class="sticky top-0 z-10 m-4 flex flex-wrap items-center gap-3 rounded-xl border border-border bg-card px-[15px] py-[11px] sm:m-6"
  >
    <h1 class="text-xl font-semibold tracking-tight text-foreground">{{ title }}</h1>
    <p class="text-sm text-muted-foreground">Panel de pruebas de mensajería</p>
  </header>

  <main
    class="grid grid-cols-1 gap-4 px-4 pb-4 sm:px-6 sm:pb-6 lg:grid-cols-[minmax(260px,320px)_minmax(280px,1fr)_minmax(320px,1fr)] lg:gap-6"
  >
    <app-connect />
    <app-send />
    <app-messages />
  </main>
</div>

<!-- CDK overlay host for the connect dialog (slice 2) and reply drawer (slice 5). -->
<hlm-toaster />
