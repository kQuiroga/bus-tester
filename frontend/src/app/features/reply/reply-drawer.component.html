<hlm-sheet side="right" [state]="open() ? 'open' : 'closed'" (stateChanged)="onStateChange($event)">
  <hlm-sheet-content
    *hlmSheetPortal
    data-testid="reply-drawer"
    [showCloseButton]="false"
    class="w-full gap-0 overflow-y-auto bg-card p-[18px] sm:max-w-[420px]"
    [attr.data-queue-color]="queueColor()"
  >
    <div class="flex items-center justify-between">
      <h2
        hlmSheetTitle
        class="flex items-center gap-2 text-[15px] font-bold text-foreground"
      >
        <span class="size-1.5 shrink-0 rounded-[3px]" [style.background-color]="'var(--queue-hue)'"></span>
        Responder
      </h2>
      <button
        type="button"
        data-testid="reply-close"
        class="bg-transparent px-0.5 text-[11px] leading-none text-muted-foreground transition hover:brightness-125"
        aria-label="Cerrar"
        (click)="close()"
      >
        ✕
      </button>
    </div>

    @if (origin(); as o) {
      <section
        data-testid="reply-origin"
        class="mt-3.5 rounded-[8px] border border-border border-l-2 bg-muted px-3 py-2.5"
        [style.border-left-color]="'var(--queue-hue)'"
      >
        <p class="field-label text-[10px]">Mensaje original</p>
        <p class="mt-1.5 font-mono text-xs text-foreground">{{ o.routingKey }}</p>
        <p class="mt-1 font-mono text-[10px] text-muted-foreground">{{ originMeta() }}</p>
        <pre
          data-testid="reply-origin-payload"
          class="mt-1.5 font-mono text-[11px] break-words whitespace-pre-wrap text-muted-foreground"
        >{{ o.payload | jsonPretty }}</pre>
      </section>
    }

    <div class="mt-3.5">
      <p class="field-label mb-1.5">Correlation ID</p>
      <input
        hlmInput
        data-testid="reply-correlation-id"
        name="correlationId"
        class="h-[34px] w-full rounded-[8px] bg-muted font-mono text-muted-foreground"
        [value]="correlationId()"
        readonly
      />
    </div>

    <form class="mt-3 flex flex-col" (ngSubmit)="send()">
      <p class="field-label mb-1.5">Payload de respuesta</p>
      <textarea
        hlmTextarea
        data-testid="reply-payload"
        name="payload"
        class="min-h-[120px] w-full rounded-[8px] bg-muted"
        [ngModel]="payload()"
        (ngModelChange)="payload.set($event)"
        (blur)="payloadTouched.set(true)"
        [ngModelOptions]="{ standalone: true }"
      ></textarea>
      @if (payloadTouched() && payloadError()) {
        <p class="mt-1 text-xs font-medium text-destructive">{{ payloadError() }}</p>
      }

      <button hlmBtn type="submit" data-testid="reply-send" class="mt-3.5 h-[38px] w-full rounded-[9px]">
        Enviar respuesta
      </button>
      <p class="mt-3 text-[11px] text-muted-foreground">El panel de Enviar queda intacto con tu borrador.</p>
    </form>
  </hlm-sheet-content>
</hlm-sheet>
