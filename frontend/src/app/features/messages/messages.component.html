<section class="rounded-xl border border-border bg-card p-4 text-card-foreground shadow-sm">
  <h2 class="text-lg font-medium text-card-foreground">Live messages</h2>
  <form class="mt-3 flex flex-col gap-3" (ngSubmit)="subscribeToQueue()">
    <label class="flex flex-col gap-1 text-sm font-medium text-card-foreground/80">
      Queue
      <input
        class="rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50"
        name="queueName"
        [ngModel]="queueName()"
        (ngModelChange)="queueName.set($event)"
        [disabled]="subscriptionId() !== null"
      />
    </label>
    <button
      class="rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50"
      type="submit"
      [disabled]="subscriptionId() !== null"
    >
      Subscribe
    </button>
    <button
      class="rounded-md border border-border px-4 py-2 text-sm font-medium text-card-foreground hover:bg-background focus:outline-none focus:ring-2 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50"
      type="button"
      (click)="unsubscribe()"
      [disabled]="subscriptionId() === null"
    >
      Unsubscribe
    </button>
  </form>
  @if (errorMessage()) {
    <p class="rounded-md bg-status-error-bg px-3 py-2 text-sm font-medium text-status-error">{{ errorMessage() }}</p>
  }
  <div class="mt-3 flex flex-col gap-2 sm:flex-row sm:items-center">
    <input
      class="flex-1 rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring"
      type="search"
      placeholder="Search messages"
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)"
    />
    <button
      class="rounded-md border border-border px-4 py-2 text-sm font-medium text-card-foreground hover:bg-background focus:outline-none focus:ring-2 focus:ring-ring"
      type="button"
      (click)="togglePause()"
    >
      {{ paused() ? 'Resume' : 'Pause' }}
    </button>
  </div>
  <ul class="mt-3 flex max-h-64 flex-col gap-2 overflow-y-auto">
    @for (message of filteredMessages(); track message.seq) {
      <li
        class="rounded-md border border-border bg-background px-3 py-2 font-mono text-xs text-foreground"
        [class.animate-message-enter]="isNewRow(message)"
      >
        <strong class="font-sans text-sm font-semibold text-card-foreground">{{ message.routingKey }}</strong> ({{ message.exchange }}):
        <pre class="mt-1 whitespace-pre-wrap">{{ message.payload | jsonPretty }}</pre>
      </li>
    }
  </ul>
</section>
