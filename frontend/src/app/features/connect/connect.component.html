<section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
  <h2 class="text-lg font-medium text-slate-800">Connection</h2>
  <form class="mt-3 flex flex-col gap-3" (ngSubmit)="connect()">
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-600">
      Host
      <input
        class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30 disabled:cursor-not-allowed disabled:bg-slate-100"
        name="host"
        [ngModel]="host()"
        (ngModelChange)="host.set($event)"
        [disabled]="connected()"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-600">
      Port
      <input
        class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30 disabled:cursor-not-allowed disabled:bg-slate-100"
        name="port"
        type="number"
        [ngModel]="port()"
        (ngModelChange)="port.set($event)"
        [disabled]="connected()"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-600">
      Username
      <input
        class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30 disabled:cursor-not-allowed disabled:bg-slate-100"
        name="username"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        [disabled]="connected()"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-slate-600">
      Password
      <input
        class="rounded-md border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30 disabled:cursor-not-allowed disabled:bg-slate-100"
        name="password"
        type="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [disabled]="connected()"
      />
    </label>
    <button
      class="rounded-md bg-brand-600 px-4 py-2 text-sm font-medium text-white hover:bg-brand-700 disabled:cursor-not-allowed disabled:opacity-50"
      type="submit"
      [disabled]="connected()"
    >
      Connect
    </button>
    <button
      class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50"
      type="button"
      (click)="disconnect()"
      [disabled]="!connected()"
    >
      Disconnect
    </button>
  </form>
  @if (connected()) {
    <p class="rounded-md bg-status-ok-bg px-3 py-2 text-sm font-medium text-status-ok">Connected</p>
  }
  @if (errorMessage()) {
    <p class="rounded-md bg-status-error-bg px-3 py-2 text-sm font-medium text-status-error">{{ errorMessage() }}</p>
  }
</section>
