<section class="rounded-xl border border-border bg-card p-4 text-card-foreground shadow-sm">
  <h2 class="text-lg font-medium text-card-foreground">Connection</h2>
  <form class="mt-3 flex flex-col gap-3" (ngSubmit)="connect()">
    <label class="flex flex-col gap-1 text-sm font-medium text-card-foreground/80">
      Host
      <input
        class="rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50"
        name="host"
        [ngModel]="host()"
        (ngModelChange)="host.set($event)"
        [disabled]="connected()"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-card-foreground/80">
      Port
      <input
        class="rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50"
        name="port"
        type="number"
        [ngModel]="port()"
        (ngModelChange)="port.set($event)"
        [disabled]="connected()"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-card-foreground/80">
      Username
      <input
        class="rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50"
        name="username"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        [disabled]="connected()"
      />
    </label>
    <label class="flex flex-col gap-1 text-sm font-medium text-card-foreground/80">
      Password
      <input
        class="rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground focus:border-primary focus:outline-none focus:ring-2 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50"
        name="password"
        type="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [disabled]="connected()"
      />
    </label>
    <button
      class="rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50"
      type="submit"
      [disabled]="connected()"
    >
      Connect
    </button>
    <button
      class="rounded-md border border-border px-4 py-2 text-sm font-medium text-card-foreground hover:bg-background focus:outline-none focus:ring-2 focus:ring-ring disabled:cursor-not-allowed disabled:opacity-50"
      type="button"
      (click)="disconnect()"
      [disabled]="!connected()"
    >
      Disconnect
    </button>
  </form>
  @if (connected()) {
    <p class="rounded-md bg-status-ok-bg px-3 py-2 text-sm font-medium text-status-ok">Connected</p>
  }
  @if (errorMessage()) {
    <p class="rounded-md bg-status-error-bg px-3 py-2 text-sm font-medium text-status-error">{{ errorMessage() }}</p>
  }
</section>
