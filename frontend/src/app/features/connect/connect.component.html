<div class="flex flex-wrap items-center gap-2">
  <app-status-pill
    [connected]="connected()"
    [pending]="pending()"
    [errorMessage]="errorMessage()"
    [hubState]="hubConnectionState()"
    (activate)="openConnectDialog()"
  />

  <!-- Reserved, inert broker-selector slot (connection-status spec: "Reserved Broker-Selector
       Slot"). No wiring: aria-hidden, non-focusable, pointer-events disabled. -->
  <div
    data-testid="broker-selector-slot"
    aria-hidden="true"
    tabindex="-1"
    inert
    class="pointer-events-none inline-flex select-none items-center rounded-md border border-dashed border-border/60 px-2 py-1 text-xs text-muted-foreground/60"
  >
    Broker
  </div>
</div>

<hlm-dialog
  [state]="connectDialogOpen() ? 'open' : 'closed'"
  (stateChanged)="onDialogStateChange($event)"
>
  <hlm-dialog-content *hlmDialogPortal class="flex flex-col gap-4">
    <app-connect-dialog
      [connected]="connected()"
      [pending]="pending()"
      [errorMessage]="errorMessage()"
      [(host)]="host"
      [(port)]="port"
      [(username)]="username"
      [(password)]="password"
      (connectSubmit)="connect()"
      (disconnect)="disconnect()"
      (changeBroker)="changeBroker()"
    />
  </hlm-dialog-content>
</hlm-dialog>
