<section class="panel">
  <h2>Send message</h2>
  <form (ngSubmit)="send()">
    <label>
      Exchange
      <input name="exchange" [ngModel]="exchange()" (ngModelChange)="exchange.set($event)" />
    </label>
    <label>
      Routing key
      <input name="routingKey" [ngModel]="routingKey()" (ngModelChange)="routingKey.set($event)" />
    </label>
    <label>
      Payload
      <textarea name="payload" [ngModel]="payload()" (ngModelChange)="payload.set($event)"></textarea>
    </label>
    <button type="submit">Send</button>
  </form>
  @if (confirmation()) {
    <p class="status status--ok">{{ confirmation() }}</p>
  }
  @if (errorMessage()) {
    <p class="status status--error">{{ errorMessage() }}</p>
  }
</section>
